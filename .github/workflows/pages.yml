# Publishes the website folder to GitHub Pages on every push to main
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # stamp the CSS and JS links with this commit so browsers fetch fresh files after every publish
      - name: Version stamp
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" laylatul-code/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: laylatul-code
      - id: deployment
        uses: actions/deploy-pages@v4
