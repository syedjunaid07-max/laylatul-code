# nginx settings for laylatul-code on the Matrix Streamline server (103.205.144.18).
# Installed by deploy/deploy.sh as /etc/nginx/sites-available/laylatul-code.
# When a domain points here, put it in server_name and add HTTPS with certbot.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/laylatul-code;
    index index.html;
    server_tokens off;

    # basic protection headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # smaller downloads for text files
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    # CSS and JS carry a ?v=<commit> stamp, so browsers can keep them for a long time
    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # images keep their names between releases, so a shorter cache
    location ~* \.(jpg|jpeg|png|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
